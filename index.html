<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SBM 2027 · Standar Biaya Masukan TA 2027</title>
  <meta name="description" content="Baca Standar Biaya Masukan TA 2027 (PMK 54/2026, KMK 296/2026) dan TA 2026 (PMK 32/2025) tanpa membuka PDF: honorarium, perjalanan dinas, fasilitas pegawai, barang dan jasa, pemeliharaan, dan bantuan.">
  <meta name="theme-color" content="#222D63">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SBM 2027">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="canonical" href="https://cek-sbm.vercel.app/">
  <script>
    // Alamat lama sbm-2027.vercel.app pindah ke cek-sbm.vercel.app. Data di perangkat (favorit, draf, pengaturan)
    // ikut dibawa lewat parameter ?pindah= karena penyimpanan browser terpisah per alamat.
    (function () {
      var NEW = 'https://cek-sbm.vercel.app';
      try {
        if (location.hostname === 'sbm-2027.vercel.app') {
          var data = {};
          for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('sbm27:') === 0) data[k] = localStorage.getItem(k); }
          var q = new URLSearchParams(location.search);
          var keys = Object.keys(data);
          if (keys.length) q.set('pindah', btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''));
          var qs = q.toString();
          location.replace(NEW + location.pathname + (qs ? '?' + qs : '') + location.hash);
          return;
        }
        var u = new URL(location.href);
        var pk = u.searchParams.get('pindah');
        if (pk) {
          var b = pk.replace(/-/g, '+').replace(/_/g, '/');
          while (b.length % 4) b += '=';
          var obj = JSON.parse(decodeURIComponent(escape(atob(b))));
          // Data yang sudah ada di alamat baru tidak ditimpa
          for (var key in obj) if (key.indexOf('sbm27:') === 0 && localStorage.getItem(key) === null) localStorage.setItem(key, obj[key]);
          u.searchParams.delete('pindah');
          history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
        }
      } catch (e) { /* abaikan */ }
    })();
  </script>
  <script>
    // Terapkan tema sebelum render untuk menghindari kedip
    try {
      var p = JSON.parse(localStorage.getItem('sbm27:theme') || '"system"');
      var d = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = d ? 'dark' : 'light';
      document.documentElement.dataset.rail = JSON.parse(localStorage.getItem('sbm27:rail') || 'false') ? '1' : '0';
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>
  <div class="app" id="app"></div>
  <noscript><p style="padding:24px">Aplikasi ini memerlukan JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
